name: ecoloop
description: "EcoLoop - Smart Waste Management & Upcycling Platform"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Fonts
  google_fonts: ^6.3.2

  # SVG Images
  flutter_svg: ^2.2.0

  # Onboarding Indicator
  smooth_page_indicator: ^1.2.1

  # Simple Animations
  animated_text_kit: ^4.2.3

  # Lottie Animations (Future)
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
